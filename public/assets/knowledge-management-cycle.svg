<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge management cycle</title>
  <desc id="desc">A connected cycle showing capture, curate, find, reuse, and feedback.</desc>
  <rect width="1200" height="700" fill="#f7fbfc"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#102e4a">KNOWLEDGE MANAGEMENT</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#496273">Make experience findable, trusted, reusable, and better over time</text>
  <g fill="none" stroke="#1596a6" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 26">
    <path d="M600 170 C820 150 980 260 965 420 C950 585 750 625 600 560 C430 630 240 565 235 410 C230 260 385 160 600 170Z"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><circle cx="600" cy="180" r="82" fill="#0e4268"/><text x="600" y="174" font-size="27" font-weight="700" fill="white">CAPTURE</text><text x="600" y="208" font-size="17" fill="#dff5f7">experience + evidence</text></g>
    <g><circle cx="900" cy="300" r="82" fill="#f2b632"/><text x="900" y="294" font-size="27" font-weight="700" fill="#102e4a">CURATE</text><text x="900" y="328" font-size="17" fill="#102e4a">context + ownership</text></g>
    <g><circle cx="850" cy="520" r="82" fill="#1596a6"/><text x="850" y="514" font-size="27" font-weight="700" fill="white">FIND</text><text x="850" y="548" font-size="17" fill="white">search + trust</text></g>
    <g><circle cx="350" cy="520" r="82" fill="#0e4268"/><text x="350" y="514" font-size="27" font-weight="700" fill="white">REUSE</text><text x="350" y="548" font-size="17" fill="#dff5f7">apply + adapt</text></g>
    <g><circle cx="300" cy="300" r="82" fill="#f2b632"/><text x="300" y="294" font-size="27" font-weight="700" fill="#102e4a">FEEDBACK</text><text x="300" y="328" font-size="17" fill="#102e4a">review + improve</text></g>
  </g>
  <rect x="410" y="315" width="380" height="105" rx="20" fill="white" stroke="#c4dfe5" stroke-width="3"/>
  <text x="600" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#102e4a">Useful knowledge is social</text>
  <text x="600" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#496273">People decide what to trust and apply</text>
</svg>
