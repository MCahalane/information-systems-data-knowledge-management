<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20242b" />
    <link rel="icon" type="image/svg+xml" href="/information-systems-data-knowledge-management/favicon.svg" />
    <title>Information Systems: Data & Knowledge Management</title>
  </head>
  <body>
<!-- IS Learning Modules shared top bar: identical in every module; links back to the collection homepage -->
<style id="isbar-style">
.isbar{background:#231f20;color:#fff;border-bottom:7px solid #ffe600;font-family:Arial,Helvetica,sans-serif;position:relative;z-index:95}
.isbar-in{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,56px);min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.isbar a,.isbar a:hover,.isbar a.active{color:#fff;text-decoration:none;border:0;padding:0;margin:0;background:none;font-family:Arial,Helvetica,sans-serif;line-height:1.3;width:auto}
.isbar-home{display:flex;align-items:center;gap:12px}
.isbar-tile{display:grid;place-items:center;width:34px;height:34px;background:#ffe600;color:#231f20;font-weight:900;font-size:13px;flex:0 0 34px}
.isbar-home b{display:block;font-size:.95rem;line-height:1.2;font-weight:700}
.isbar-home small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#ffe600;line-height:1.4}
.isbar-nav{display:flex;gap:22px}
.isbar-nav a{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.isbar a:hover{color:#ffe600}
.isbar a:focus-visible{outline:3px solid #ffe600;outline-offset:3px}
@media(max-width:700px){.isbar-in{min-height:52px;gap:12px}.isbar-nav a:not(.isbar-all){display:none}.isbar-home small{display:none}.isbar-tile{width:30px;height:30px;flex-basis:30px}.isbar-all{white-space:nowrap}}
@media print{.isbar{display:none}}
</style>
<div class="isbar" role="navigation" aria-label="Information Systems learning modules">
  <div class="isbar-in">
    <a class="isbar-home" href="https://mcahalane.github.io/IS-Learning-Modules/"><span class="isbar-tile" aria-hidden="true">IS</span><span><b>Information Systems</b><small>Plug &amp; Play Learning Modules</small></span></a>
    <div class="isbar-nav">
      <a class="isbar-all" href="https://mcahalane.github.io/IS-Learning-Modules/#modules">All modules</a>
      <a href="https://mcahalane.github.io/IS-Learning-Modules/#plug-in">Plug it in</a>
      <a href="https://mcahalane.github.io/IS-Learning-Modules/#why">Why this approach</a>
    </div>
  </div>
</div>
<script>/* Keep a module's sidebar fully visible below the bar: fixed sidebars start under it, sticky sidebars shrink to the visible height. */(()=>{const bar=document.querySelector('.isbar');if(!bar)return;const fit=()=>{const vis=Math.max(0,bar.offsetHeight-scrollY);document.querySelectorAll('body > aside, .rail').forEach(el=>{const pos=getComputedStyle(el).position;el.style.top=pos==='fixed'?vis+'px':'';el.style.height=pos==='sticky'?(innerHeight-vis)+'px':''})};addEventListener('scroll',fit,{passive:true});addEventListener('resize',fit);document.addEventListener('DOMContentLoaded',fit);addEventListener('load',fit);fit()})();</script>
<!-- /IS shared top bar -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
